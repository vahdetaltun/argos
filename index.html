<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARGOS">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="ARGOS — otonom robotaksi simülasyonu">
  <title>ARGOS — Otonom Robotaksi Simülasyonu</title>
  <link rel="icon" type="image/png" href="TemplateData/icon.png">
  <link rel="apple-touch-icon" href="TemplateData/icon.png">
  <link rel="manifest" href="TemplateData/manifest.webmanifest">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
                 touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
                 -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
    #loader { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
              background: #000; color: #8a94a3; font: 600 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .14em;
              transition: opacity .6s; }
    #loader img { width: min(62vw, 440px); }
    #bar { width: min(56vw, 340px); height: 3px; margin-top: 26px; background: #1a2029; border-radius: 2px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #8f0e15, #e2353d); transition: width .2s; }
    #pct { margin-top: 12px; }
    #credits { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); left: 16px; right: 16px; text-align: center;
               font: 400 10px/1.5 system-ui, -apple-system, sans-serif; letter-spacing: 0; color: #4d5663; }
    #credits a { color: inherit; }
    #fs { position: fixed; z-index: 4; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
          height: 36px; padding: 0 14px; border-radius: 9px; border: 1.5px solid rgba(0, 217, 255, .6);
          background: rgba(9, 18, 30, .86); color: #e9f2ff; font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif;
          letter-spacing: .06em; cursor: pointer; display: none; }
    #rotate { position: fixed; inset: 0; z-index: 8; display: none; flex-direction: column; align-items: center; justify-content: center;
              background: #000; color: #dfe7f1; font: 600 16px system-ui, -apple-system, sans-serif; text-align: center; }
    #rotate .phone { width: 46px; height: 78px; border: 3px solid #e2353d; border-radius: 9px; animation: turn 2s ease-in-out infinite; margin-bottom: 22px; }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    /* sol üstte, panelin logo alanının üstünde: haritayı ve butonları kapatmaz */
    #hint { position: fixed; z-index: 6; left: calc(max(10px, env(safe-area-inset-left)) + 6px); top: calc(max(10px, env(safe-area-inset-top)) + 4px);
            display: none; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 10px;
            background: rgba(9, 18, 30, .96); border: 1px solid rgba(255, 255, 255, .15); color: #dfe7f1;
            font: 500 12px system-ui, -apple-system, sans-serif; white-space: nowrap; }
    #hint button { border: 0; background: transparent; color: #8a94a3; font-size: 18px; padding: 0 4px; }
    #err { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; padding: 24px;
           background: #000; color: #ffb4b0; font: 500 15px system-ui, -apple-system, sans-serif; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <img src="TemplateData/logo.png" alt="ARGOS">
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">YÜKLENİYOR</div>
    <div id="credits">Araç modeli: “Car Concept” — Eric Chadwick, Darmstadt Graphics Group GmbH (Khronos glTF Sample Assets,
      <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>) ·
      Yazı tipleri: Rajdhani, Audiowide (SIL OFL 1.1) · Unity 6 ile geliştirilmiştir</div>
  </div>
  <button id="fs" type="button">TAM EKRAN</button>
  <div id="rotate"><div class="phone"></div>Telefonu yatay çevirin</div>
  <div id="hint"><span>Tam ekran için: <b>Paylaş</b> → <b>Ana Ekrana Ekle</b></span><button type="button" aria-label="Kapat">✕</button></div>
  <div id="err"></div>

  <script src="Build/Web.loader.js"></script>
  <script>
    var ua = navigator.userAgent;
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isMobile = isIOS || /Android|Mobi/.test(ua);
    var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches;
    var canvas = document.getElementById("unity-canvas");

    var config = {
      arguments: [],
      dataUrl: "Build/Web.data.unityweb",
      frameworkUrl: "Build/Web.framework.js.unityweb",
      codeUrl: "Build/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ARGOS",
      productName: "ARGOS",
      productVersion: "0.1.0",
      // telefonda çözünürlüğü sınırla: keskin ama akıcı
      devicePixelRatio: isMobile ? Math.min(window.devicePixelRatio || 1, 2) : undefined,
      showBanner: function (msg, type) { if (type === "error") showError(msg); else console.log(msg); }
    };

    function showError(msg) {
      var e = document.getElementById("err");
      e.textContent = "ARGOS başlatılamadı: " + msg;
      e.style.display = "flex";
    }

    var fill = document.getElementById("fill"), pct = document.getElementById("pct");
    createUnityInstance(canvas, config, function (p) {
      fill.style.width = Math.round(p * 100) + "%";
      pct.textContent = "YÜKLENİYOR  %" + Math.round(p * 100);
    }).then(function (instance) {
      window.unityInstance = instance;
      window.argosReady = true;
      var l = document.getElementById("loader");
      l.style.opacity = 0;
      setTimeout(function () { l.style.display = "none"; }, 650);

      // tam ekran: iPhone Safari desteklemez (orada Ana Ekrana Ekle ipucu gösterilir)
      var fs = document.getElementById("fs");
      if (!isIOS && document.fullscreenEnabled && !standalone) {
        fs.style.display = "block";
        fs.addEventListener("click", function () { instance.SetFullscreen(document.fullscreenElement ? 0 : 1); });
        document.addEventListener("fullscreenchange", function () { fs.textContent = document.fullscreenElement ? "PENCERE" : "TAM EKRAN"; });
      }
      var seen = false;
      try { seen = localStorage.getItem("argosHint") === "1"; } catch (e) {}
      if (isIOS && !standalone && !seen) {
        var h = document.getElementById("hint");
        h.style.display = "flex";
        var close = function () { h.style.display = "none"; try { localStorage.setItem("argosHint", "1"); } catch (e) {} };
        h.querySelector("button").addEventListener("click", close);
        setTimeout(close, 12000);
      }
    }).catch(showError);
  </script>
</body>
</html>
